<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kivo Office (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b6fb8'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EK%3C/text%3E%3C/svg%3E">


    <style>
/* ---- theme.css (copied from current Kivo) ---- */
/* ============================================================
   Kivo theme — "clear sky"
   Baby blue and white. Soft clouds, big radii, one deep blue
   for actions. Display face: Bricolage Grotesque. Body face:
   Instrument Sans.
   ============================================================ */

:root {
    /* palette */
    --paper: #f2f8fe;
    /* page background, near-white with a blue cast */
    --cloud: #ffffff;
    /* cards */
    --baby: #bfe0f7;
    /* signature baby blue */
    --baby-soft: #e2f0fb;
    /* washes, hovers */
    --sky: #4a9fde;
    /* bright accents */
    --deep: #1b6fb8;
    /* primary actions */
    --deep-press: #155a97;
    --ink: #12324e;
    /* headings, body text */
    --ink-soft: #557595;
    /* secondary text */
    --line: #d5e7f7;
    /* hairlines, borders */

    /* status */
    --st-planned: #7fa6c7;
    --st-progress: #e59f35;
    --st-finished: #3fa46a;
    --st-planned-bg: #eaf2f9;
    --st-progress-bg: #fdf3e3;
    --st-finished-bg: #e8f6ee;

    /* misc */
    --danger: #d4544a;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px rgba(27, 111, 184, 0.10);
    --shadow-lift: 0 16px 40px rgba(27, 111, 184, 0.16);
    --font-display: 'Bricolage Grotesque', 'Instrument Sans', sans-serif;
    --font-body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    -webkit-font-smoothing: antialiased;
}

body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
}

/* signature sky: two soft cloud washes floating near the top of every page */
.sky-body {
    background:
        radial-gradient(900px 420px at 12% -8%, rgba(191, 224, 247, 0.75), transparent 65%),
        radial-gradient(700px 380px at 88% -12%, rgba(191, 224, 247, 0.55), transparent 60%),
        var(--paper);
    background-attachment: fixed;
}

button {
    font-family: inherit;
    cursor: pointer;
}

input,
textarea,
select {
    font-family: inherit;
}

a {
    color: var(--deep);
}

/* ---------- top bar ---------- */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 1.5rem;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 40;
}

.topbar-left,
.topbar-right {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    min-width: 0;
}

.brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.45rem;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-decoration: none;
}

.brand .brand-dot {
    color: var(--sky);
}

.icon-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--cloud);
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 1.05rem;
    transition: background 0.15s, color 0.15s;
}

.icon-link:hover {
    background: var(--baby-soft);
    color: var(--deep);
}

.user-chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.85rem 0.3rem 0.3rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--cloud);
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink);
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
}

/* ---------- avatars ---------- */

.avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--baby), var(--sky));
    color: #fff;
    font-weight: 700;
    font-size: 0.82rem;
    text-transform: uppercase;
    flex-shrink: 0;
    user-select: none;
}

.avatar-stack {
    display: inline-flex;
    align-items: center;
}

.avatar-stack .avatar {
    border: 2px solid var(--cloud);
    margin-left: -8px;
}

.avatar-stack .avatar:first-child {
    margin-left: 0;
}

/* ---------- buttons ---------- */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    border: none;
    border-radius: 999px;
    padding: 0.62rem 1.35rem;
    font-size: 0.92rem;
    font-weight: 700;
    background: var(--deep);
    color: #fff;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 16px rgba(27, 111, 184, 0.25);
    text-decoration: none;
}

.btn:hover {
    background: var(--deep-press);
    transform: translateY(-1px);
}

.btn:disabled {
    opacity: 0.55;
    cursor: default;
    transform: none;
}

.btn-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.6rem 1.25rem;
    font-size: 0.92rem;
    font-weight: 600;
    background: var(--cloud);
    color: var(--ink);
    transition: background 0.15s, border-color 0.15s;
    text-decoration: none;
}

.btn-ghost:hover {
    background: var(--baby-soft);
    border-color: var(--baby);
}

.btn-danger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 999px;
    padding: 0.62rem 1.35rem;
    font-size: 0.92rem;
    font-weight: 700;
    background: var(--danger);
    color: #fff;
    transition: filter 0.15s;
}

.btn-danger:hover {
    filter: brightness(0.92);
}

.btn-danger-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(212, 84, 74, 0.35);
    border-radius: 999px;
    padding: 0.55rem 1.1rem;
    font-size: 0.88rem;
    font-weight: 600;
    background: transparent;
    color: var(--danger);
    transition: background 0.15s;
}

.btn-danger-ghost:hover {
    background: rgba(212, 84, 74, 0.08);
}

.btn-small {
    padding: 0.4rem 0.95rem;
    font-size: 0.84rem;
}

/* visible keyboard focus everywhere */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
    outline: 3px solid rgba(74, 159, 222, 0.55);
    outline-offset: 2px;
}

/* ---------- forms ---------- */

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1.05rem;
}

.form-group label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
}

.form-group input,
.form-group textarea {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--cloud);
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--sky);
    box-shadow: 0 0 0 4px rgba(74, 159, 222, 0.15);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #9db8d2;
}

.form-error {
    color: var(--danger);
    font-size: 0.86rem;
    font-weight: 600;
    min-height: 1.1em;
    margin: 0.2rem 0 0.6rem;
}

/* ---------- modals ---------- */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(18, 50, 78, 0.35);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
}

.modal.open {
    display: flex;
}

.modal-card {
    background: var(--cloud);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lift);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    animation: modal-in 0.18s ease-out;
}

.modal-card.modal-small {
    max-width: 420px;
}

@keyframes modal-in {
    from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

@media (prefers-reduced-motion: reduce) {

    .modal-card,
    .btn,
    .btn-ghost {
        animation: none;
        transition: none;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem 0.5rem;
}

.modal-header h3 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.btn-close {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.5rem;
    line-height: 1;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    transition: background 0.15s;
}

.btn-close:hover {
    background: var(--baby-soft);
}

.modal-body {
    padding: 0.9rem 1.5rem 0.5rem;
}

.modal-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.6rem;
    padding: 0.75rem 1.5rem 1.4rem;
}

.modal-footer .push-left {
    margin-right: auto;
}

/* ---------- status pills ---------- */

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: none;
    border-radius: 999px;
    padding: 0.32rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
}

.status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}

.status-planned {
    background: var(--st-planned-bg);
    color: #4b7396;
}

.status-in_progress {
    background: var(--st-progress-bg);
    color: #a86d14;
}

.status-finished {
    background: var(--st-finished-bg);
    color: #257a4c;
}

/* segmented status control (task modal) */
.status-seg {
    display: flex;
    background: var(--baby-soft);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
}

.status-seg button {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 999px;
    padding: 0.5rem 0.4rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
}

.status-seg button:hover {
    color: var(--ink);
}

.status-seg button.active {
    background: var(--cloud);
    box-shadow: 0 2px 8px rgba(27, 111, 184, 0.18);
}

.status-seg button.active[data-status="planned"] {
    color: #4b7396;
}

.status-seg button.active[data-status="in_progress"] {
    color: #a86d14;
}

.status-seg button.active[data-status="finished"] {
    color: #257a4c;
}

/* ---------- tag pills ---------- */

.task-tag {
    display: inline-block;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 700;
    white-space: nowrap;
}

.tag-c0 { background: #e3effa; color: #2a6ca8; }
.tag-c1 { background: #e6f4ef; color: #237a55; }
.tag-c2 { background: #fdf1e0; color: #a06a15; }
.tag-c3 { background: #f4e9fa; color: #7b3fa4; }
.tag-c4 { background: #fdeaea; color: #b04a44; }
.tag-c5 { background: #e5f3f6; color: #22788b; }
.tag-c6 { background: #eeeffb; color: #4b53b8; }
.tag-c7 { background: #fbecf3; color: #ab4478; }

/* ---------- dropdown menus ---------- */

.menu-wrap {
    position: relative;
}

.menu-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.2rem;
    line-height: 1;
    transition: background 0.15s;
}

.menu-btn:hover {
    background: var(--baby-soft);
    color: var(--ink);
}

.menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lift);
    min-width: 170px;
    padding: 0.35rem;
    z-index: 60;
}

.menu.open {
    display: block;
}

.menu-item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    transition: background 0.12s;
}

.menu-item:hover {
    background: var(--baby-soft);
}

.menu-item.danger {
    color: var(--danger);
}

.menu-item.danger:hover {
    background: rgba(212, 84, 74, 0.08);
}

/* ---------- misc ---------- */

.role-badge {
    display: inline-block;
    padding: 0.16rem 0.6rem;
    border-radius: 999px;
    background: var(--baby-soft);
    color: var(--deep);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    vertical-align: middle;
}

.delete-warning {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.55;
}

/* ---- auth.css (copied from current Kivo) ---- */
/* Sign-in page — one white card floating in a baby blue sky. */

.auth-body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background:
        radial-gradient(800px 500px at 15% 0%, rgba(191, 224, 247, 0.9), transparent 60%),
        radial-gradient(700px 450px at 90% 20%, rgba(191, 224, 247, 0.65), transparent 60%),
        radial-gradient(600px 400px at 50% 110%, rgba(191, 224, 247, 0.5), transparent 65%),
        var(--paper);
}

.auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: var(--shadow-lift);
    padding: 2.5rem 2.25rem 2rem;
    text-align: center;
}

.auth-logo {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 1.6rem;
}

.auth-logo .brand-dot {
    color: var(--sky);
}

.auth-title {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
}

.auth-subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-bottom: 1.8rem;
}

.auth-form {
    text-align: left;
}

.auth-submit {
    width: 100%;
    margin-top: 0.4rem;
    padding: 0.8rem;
    font-size: 1rem;
}

.auth-note {
    margin-top: 1.5rem;
    font-size: 0.84rem;
    color: var(--ink-soft);
}

/* ---- settings.css (copied from current Kivo) ---- */
/* Settings — account overview plus the admin panel. */

.page {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
}

.page-head {
    margin-bottom: 2rem;
}

.page-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
}

.settings-card {
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.6rem 1.75rem;
    margin-bottom: 1.4rem;
}

.card-title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 1rem;
}

.card-note {
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 1.2rem;
}

.account-row {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-bottom: 0.6rem;
}

.avatar-lg {
    width: 52px;
    height: 52px;
    font-size: 1.3rem;
}

.account-name {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
}

/* admin create form: inline on wide screens */
.admin-create {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 0.75rem;
    align-items: end;
    margin-bottom: 0.4rem;
}

.admin-create .form-group {
    margin-bottom: 0;
}

.user-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 1rem;
}

.user-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.8rem;
}

.user-row .user-name {
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
    flex-wrap: wrap;
}

.user-row .user-since {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 500;
}

.user-row .user-actions {
    margin-left: auto;
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
}

@media (max-width: 640px) {
    .page {
        padding: 2rem 1rem 4rem;
    }

    .admin-create {
        grid-template-columns: 1fr;
        align-items: stretch;
    }

    .user-row {
        flex-wrap: wrap;
    }

    .user-row .user-actions {
        width: 100%;
        margin-left: 0;
        justify-content: flex-end;
    }
}

/* ---- dashboard.css (copied from current Kivo) ---- */
/* Dashboard — a stack of wide "flight strip" roadmap cards on a sky page. */

.page {
    max-width: 880px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
}

.page-head {
    margin-bottom: 2rem;
}

.page-eyebrow {
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--sky);
    margin-bottom: 0.35rem;
    min-height: 1em;
}

.page-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
}

/* ---------- roadmap strips ---------- */

.roadmap-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.roadmap-strip {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.4rem 1.6rem 1.5rem;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s;
}

.roadmap-strip:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lift);
    border-color: var(--baby);
}

.strip-top {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
}

.strip-title {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
}

.strip-desc {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-top: 0.3rem;
    max-width: 60ch;
}

/* runway progress bar: finished share of all tasks */
.strip-runway {
    margin-top: 1.15rem;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.runway {
    flex: 1;
    height: 10px;
    border-radius: 999px;
    background: var(--baby-soft);
    overflow: hidden;
    display: flex;
}

.runway .seg {
    height: 100%;
}

.runway .seg-finished {
    background: var(--st-finished);
}

.runway .seg-progress {
    background: var(--st-progress);
}

.runway-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);

    margin-bottom: 1rem;
}

.public-share-label {
    display: block;
    font-size: 0.84rem;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 0.7rem;

}

.share-link-box {
    display: flex;
    gap: 0.45rem;
    align-items: center;
}

.share-link-input {
    flex: 1;
    min-width: 0;

/* ---------- responsive ---------- */

@media (max-width: 640px) {

    }

/* ---- roadmap.css (copied from current Kivo) ---- */
/* Roadmap page — tasks as a grouped status ledger instead of a kanban board.
   Also used by the public read-only view (view.html). */

.page {
    max-width: 880px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
}

.board-title {
    min-width: 0;
}

.board-title h1 {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.roadmap-meta {
    font-size: 0.84rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 48ch;
}

.read-only-badge {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--deep);
    background: var(--baby-soft);
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    white-space: nowrap;
}

/* ---------- status sections ---------- */

.status-section {
    margin-bottom: 2.4rem;
}

.section-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
    padding-left: 0.2rem;
}

.section-header h2 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.section-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
}

.section-dot.planned { background: var(--st-planned); }
.section-dot.in_progress { background: var(--st-progress); }
.section-dot.finished { background: var(--st-finished); }

.section-count {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.12rem 0.6rem;
}

.section-empty {
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 1rem 1.2rem;
    background: rgba(255, 255, 255, 0.55);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
}

/* ---------- task rows ---------- */

.task-rows {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
}

.task-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--cloud);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s;
    box-shadow: 0 3px 10px rgba(27, 111, 184, 0.05);
}

.task-row:hover {
    transform: translateY(-1px);
    border-color: var(--baby);
    box-shadow: var(--shadow);
}

.task-row .task-name {
    font-weight: 600;
    font-size: 0.98rem;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.task-row.finished .task-name {
    color: var(--ink-soft);
}

.task-row .task-tags {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    min-width: 0;
}

.task-row .row-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    flex-shrink: 0;
}

/* status pill acts as a quick-change button */
.task-row .status-pill {
    cursor: pointer;
    transition: filter 0.12s;
}

.task-row .status-pill:hover {
    filter: brightness(0.95);
}

.status-menu {
    min-width: 150px;
}

/* ---------- assignee picker in the task modal ---------- */

.assignee-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
}

.assignee-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    border: 1px solid var(--line);
    background: var(--cloud);
    border-radius: 999px;
    padding: 0.3rem 0.85rem 0.3rem 0.35rem;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: background 0.14s, border-color 0.14s, color 0.14s;
}

.assignee-chip input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.assignee-chip .avatar {
    width: 24px;
    height: 24px;
    font-size: 0.7rem;
}

.assignee-chip.selected {
    background: var(--baby-soft);
    border-color: var(--sky);
    color: var(--deep);
}

.assignee-hint {
    font-size: 0.84rem;
    color: var(--ink-soft);
}

/* ---------- public view extras ---------- */

.public-unavailable {
    text-align: center;
    padding: 5rem 1rem;
    color: var(--ink-soft);
}

.public-unavailable h2 {
    font-family: var(--font-display);
    color: var(--ink);
    margin-bottom: 0.5rem;
}

/* ---------- responsive ---------- */

@media (max-width: 640px) {
    .topbar {
        padding: 0.75rem 1rem;
    }

    .page {
        padding: 1.75rem 1rem 4rem;
    }

    .task-row {
        flex-wrap: wrap;
    }

    .task-row .row-right {
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
    }
}

/* ============================================================

  // ---------- drag (pointer events: mouse, pen and touch) ----------

    const canChange = C.STATUSES.some((s) => s !== t.status && C.canMove(u, t, s).ok);

      ? h('div', { class: 'menu-wrap' }, statusPill(t.status, 'button', { type: 'button', title: 'Change status', 'aria-haspopup': 'menu', onclick: (e) => { e.stopPropagation(); const open = menu.classList.contains('open'); document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open')); if (!open) menu.classList.add('open'); } }), menu)
      : statusPill(t.status, 'span', { title: 'You can\'t change this status' });
    const row = h('div', { class: 'task-row ' + t.status + (canChange ? ' can-drag' : ''), tabindex: '0', role: 'button', 'data-ctx': 'task:' + t.id, 'aria-label': 'Open task ' + t.title,
      onclick: () => { if (!suppressClick) taskModal(t, r); },
      onkeydown: (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); taskModal(t, r); } },
    },
      pill,
      h('span', { class: 'task-name', text: t.title }),
      t.tags.length ? h('span', { class: 'task-tags' }, t.tags.map(tagEl)) : null,
      h('span', { class: 'row-right' },
        ncom ? h('span', { class: 'row-meta', text: plural(ncom, 'comment', 'comments') }) : null,
        editable ? h('span', { class: 'you-badge', text: 'Yours' }) : h('span', { class: 'ro-badge', text: 'Read only' }),
        people.length ? h('span', { class: 'avatar-stack', title: people.map((p) => C.dn(p)).join(', ') }, people.slice(0, 4).map((p) => avatarEl(p)))
          : h('span', { class: 'row-meta unassigned' + (flagged ? ' flagged' : ''), text: flagged ? 'Needs a new assignee' : 'Unassigned' })));
    if (canChange) attachDrag(row, t);
    return row;
  }

  // ---------- task modal ----------
  let commentsRepaint = null; // set by the open task modal so a deleted comment disappears from its thread
  document.addEventListener('kivo-comments', () => { if (commentsRepaint) commentsRepaint(); });
  function taskModal(t, r) {
    const u = C.me();
    const isNew = !t;
    const creator = C.isCreator(u, r);
    const assigner = isNew ? creator : C.canAssign(u, r, t);
    if (isNew && !creator) return;
    const canEdit = isNew ? true : C.canEditTask(u, t);
    const archived = C.isArchived(r);
    const selected = new Set(isNew ? [] : t.assignees);
    const err = h('p', { class: 'form-error', role: 'alert' });
    const openStatus = isNew ? 'planned' : t.status; // what the modal opened with
    let status = openStatus;
    const body = h('div');

    const name = h('input', { type: 'text', id: 't-name', maxlength: 120, value: isNew ? '' : t.title, placeholder: 'e.g. Write the launch post' });
    const desc = h('textarea', { id: 't-desc', rows: 4, maxlength: 2000, placeholder: 'Describe this task' });
    desc.value = isNew ? '' : t.description;
    const tags = h('input', { type: 'text', id: 't-tags', value: isNew ? '' : t.tags.join(', '), placeholder: 'comma separated, e.g. Design, Launch' });

    if (!isNew && (t.flags || []).length && !t.assignees.length) {
      body.append(h('p', { class: 'info-note flag', text: 'Needs a new assignee: ' + t.flags.map((f) => C.dn(C.user(f.userId)) + ' (' + f.reason + ')').join(', ') + '.' }));
    }
    if (canEdit) {
      body.append(h('div', { class: 'form-group' }, h('label', { for: 't-name' }, 'Name'), name),
        h('div', { class: 'form-group' }, h('label', { for: 't-desc' }, 'Description'), desc));
      if (!isNew) {
        const seg = h('div', { class: 'status-seg' }, C.STATUSES.map((s) => {
          const m = s === t.status ? { ok: true } : C.canMove(u, t, s);
          return h('button', { type: 'button', 'data-status': s, class: s === status ? 'active' : '', disabled: !m.ok, title: m.ok ? '' : m.reason, text: C.STATUS_LABEL[s],
            onclick: () => { status = s; seg.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.status === s)); } });
        }));
        body.append(h('div', { class: 'form-group' }, h('label', null, 'Status'), seg,
          h('span', { class: 'assignee-hint', text: C.isOwner(u, r) ? 'Tasks move forward only. As the owner you can also move one back; that is logged as an override.' : 'Tasks move forward only: Planned, In progress, Finished. You will be asked to confirm.' })));
      }
      body.append(h('div', { class: 'form-group' }, h('label', { for: 't-tags' }, 'Tags'), tags));
    } else {
      addAll(body,
        h('div', { class: 'ro-block' }, h('h4', { class: 'ro-title', text: t.title }), statusPill(t.status)),
        t.description ? h('p', { class: 'ro-desc', text: t.description }) : h('p', { class: 'ro-desc muted', text: 'No description.' }),
        t.tags.length ? h('div', { class: 'task-tags ro-tags' }, t.tags.map(tagEl)) : null,
        h('p', { class: 'info-note', text: archived ? 'This roadmap is archived, so the task is read-only.' : u.role === 'it' ? 'Admins can read and comment. Only assigned people can edit.' : 'Only the people assigned to this task can edit it or mark it complete. You can read it and leave a comment.' }));
      if (C.isOwner(u, r) && !archived && t.status !== 'planned') {
        const back = C.STATUSES.slice(0, C.STATUSES.indexOf(t.status));
        body.append(h('div', { class: 'form-group' }, h('label', null, 'Owner override'),
          h('div', { class: 'head-actions left0' }, back.map((s) => h('button', { class: 'btn-ghost btn-small', type: 'button', text: 'Move back to ' + C.STATUS_LABEL[s], onclick: () => moveTask(t, s, () => { modals.slice().forEach((m) => m.close()); }) })))));
      }
    }

    // assignees: editable only for people who may assign
    const pool = C.assignable(r).map(C.user).filter(Boolean);
    if (assigner) {
      const picker = h('div', { class: 'assignee-picker' }, pool.map((p) => {
        const cb = h('input', { type: 'checkbox', checked: selected.has(p.id), onchange: () => { if (cb.checked) selected.add(p.id); else selected.delete(p.id); lab.classList.toggle('selected', cb.checked); } });
        const lab = h('label', { class: 'assignee-chip' + (selected.has(p.id) ? ' selected' : '') }, cb, avatarEl(p), p.id === r.managerId ? p.name + ' (owner)' : p.name);
        return lab;
      }));
      body.append(h('div', { class: 'form-group' }, h('label', null, 'Who is working on this?'), picker,
        h('span', { class: 'assignee-hint', text: 'Only the people you pick can edit this task or mark it complete.' })));
    } else if (!isNew) {
      const ppl = t.assignees.map(C.user).filter(Boolean);
      body.append(h('div', { class: 'form-group' }, h('label', null, 'Assigned to'),
        ppl.length ? h('div', { class: 'assignee-picker' }, ppl.map((p) => h('span', { class: 'assignee-chip selected static' }, avatarEl(p), C.dn(p))))
          : h('span', { class: 'assignee-hint', text: 'Nobody is assigned yet, so nobody can edit this task.' })));
    }

    // comments
    if (!isNew) {
      const list = h('div', { class: 'comments' });
      const paint = () => {
        clear(list);
        let cs = [];
        try { cs = C.commentsFor(t.id); } catch (e) { /* task gone */ }
        if (!cs.length) list.append(h('p', { class: 'access-empty', text: 'No comments yet.' }));
        cs.forEach((c) => { const a = C.user(c.userId); list.append(h('div', { class: 'comment', 'data-ctx': 'comment:' + c.id }, avatarEl(a),
          h('div', { class: 'comment-main' },
            h('div', { class: 'comment-head' }, h('strong', { text: C.dn(a) }), h('time', { text: ' ' + fmtTime(c.at) }),
              C.canDeleteComment(u, c) ? h('button', { class: 'comment-del', type: 'button', title: 'Delete comment', 'aria-label': 'Delete comment', onclick: () => deleteCommentFlow(c) }, svgIcon(ICON.trash, 14)) : null),
            h('p', { text: c.text })))); });
        list.scrollTop = list.scrollHeight;
      };
      const box = h('textarea', { rows: 2, maxlength: 1000, placeholder: 'Write a comment', 'aria-label': 'Write a comment' });
      const cerr = h('p', { class: 'form-error', role: 'alert' });
      const post = () => {
        cerr.textContent = '';
        try { C.addComment(t.id, box.value); box.value = ''; paint(); } catch (e) { cerr.textContent = e.message; }
      };
      box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(); } });
      paint();
      commentsRepaint = paint;
      body.append(h('div', { class: 'comments-block' }, h('h4', { class: 'block-title', text: 'Comments' }), list,
        archived ? h('p', { class: 'assignee-hint', text: 'Archived roadmap: comments are closed.' })
          : [h('div', { class: 'comment-form' }, box, h('button', { class: 'btn btn-small', type: 'button', onclick: post, text: 'Post comment' })), cerr]));
    }
    body.append(err);

    const doSave = (close) => {
      err.textContent = '';
      try {
        if (isNew) C.createTask(r.id, { title: name.value, description: desc.value, tags: tags.value, assignees: [...selected] });
        else {
          const patch = {};
          if (canEdit) Object.assign(patch, { title: name.value, description: desc.value, tags: tags.value });
          if (canEdit && status !== openStatus) patch.status = status;
          if (assigner) patch.assignees = [...selected];
          C.updateTask(t.id, patch);
        }
        close(); toast(isNew ? 'Task created.' : 'Task saved.'); render();
      } catch (e) { err.textContent = e.message; render(); }
    };
    const save = (close) => {
      if (!isNew && canEdit && status !== openStatus) {
        confirmBox('Move task?', 'Move ' + t.title + ' to ' + C.STATUS_LABEL[status] + '? This can\'t be undone.', 'Move task', () => doSave(close));
      } else doSave(close);
    };
    const canSave = canEdit || assigner;
    const canDelete = !isNew && (C.isOwner(u, r) || (t.createdBy === u.id && creator));
    openModal({
      onClose: () => { commentsRepaint = null; },
      title: isNew ? 'New task' : (canEdit ? 'Edit task' : 'Task'),
      body,
      footer: (close) => [
        canDelete ? h('button', { class: 'btn-danger-ghost push-left', onclick: () => confirmBox('Delete task?', 'This removes the task and its comments for everyone. The log keeps a record. There is no undo.', 'Delete task', async () => { close(); await run(() => C.deleteTask(t.id), 'Task deleted.'); }, true), text: 'Delete task' }) : null,
        h('button', { class: 'btn-ghost', onclick: close, text: canSave ? 'Cancel' : 'Close' }),
        canSave ? h('button', { class: 'btn', onclick: () => save(close), text: isNew ? 'Create task' : 'Save task' }) : null,
      ],
    });
  }

  // ---------- team (manager) ----------
  function pageTeam() {
    const u = C.me();
    if (u.role !== 'manager') return pageMissing('Only managers have a team page.');
    const ms = C.managedMembers(u);
    return h('div', null, topbar({ active: 'team' }),
      h('main', { class: 'page' },
        pageHead('Manager', 'My team', h('button', { class: 'btn', onclick: () => accountModal('member'), text: '+ Invite team member' })),
        ms.length ? h('div', { class: 'mgr-card' }, h('div', { class: 'mgr-panel static' }, ms.map((x) => personRow(x))))
          : emptyState('No team members yet', 'Invite each person. They get a one-time link and choose their own password.',
            h('button', { class: 'btn', onclick: () => accountModal('member'), text: '+ Invite team member' }))));
  }

  // ---------- user page ----------
  function pageUser(id) {
    const u = C.me(); const t = C.user(id);
    if (!t || !C.canSeeProfile(u, t)) return pageMissing('That account doesn\'t exist, or you can\'t view it.');
    const creator = t.createdBy ? C.user(t.createdBy) : null;
    const last = C.lastLogin(t.id);
    const head = h('div', { class: 'settings-card profile-head' },
      avatarEl(t, 'avatar-xl', true),
      h('div', { class: 'profile-main' },
        h('h2', { class: 'account-name', text: C.dn(t) }),
        h('p', { class: 'person-sub' }, '@' + t.username, ' ', roleBadge(t.role)),
        h('p', { class: 'profile-status' }, roleLine(t)),
        h('p', { class: 'person-sub', text: [creator ? 'Invited by ' + C.dn(creator) : 'Original admin', 'on ' + fmtTime(t.createdAt), last ? 'last signed in ' + ago(last) : 'never signed in'].join(' · ') }),
        h('div', { class: 'head-actions left' },
          C.canResetPassword(u, t) ? h('button', { class: 'btn-ghost btn-small', onclick: () => resetModal(t), text: t.hash ? 'Send reset link' : 'New invite link' }) : null,
          C.canDeactivate(u, t) ? activeToggle(t) : null,
          u.id === t.id ? h('a', { class: 'btn btn-small', href: '#/profile' }, 'Edit my profile') : null)));
    let logs = null;
    if (C.canSeeAccountLog(u, t)) {
      const l = C.accountLog(t.id);
      logs = [
        h('h3', { class: 'card-title', text: 'Account log: what ' + t.name.split(' ')[0] + ' did' }), logList(l.by, { hideActor: true, empty: 'This account has not done anything yet.' }),
        l.about.length ? [h('h3', { class: 'card-title sp', text: 'Done to this account by others' }), logList(l.about)] : null,
      ];
    }
    return h('div', null, topbar({ back: u.role === 'it' ? '#/' : (u.role === 'manager' ? '#/team' : '#/'), title: C.dn(t), meta: C.ROLE_LABEL[t.role] }),
      h('main', { class: 'page' }, head, logs ? h('div', { class: 'settings-card' }, logs) : null));
  }

  function pagePasswords() {
    if (C.me().role !== 'it') return pageMissing('Only IT admins can see the password log.');
    const es = C.passwordLog();
    const KIND = {
      invite_issued: ['invite link issued', 'tag-c0'], invite_used: ['invite used, password set', 'tag-c1'],
      reset_issued: ['reset link issued', 'tag-c2'], reset_used: ['reset used, password set', 'tag-c1'],
      demo_set: ['demo password', 'tag-c6'], set: ['password set', 'tag-c1'], reset: ['reset', 'tag-c2'],
    };
    const rows = es.map((p) => {
      const t = C.user(p.userId), by = p.byId ? C.user(p.byId) : null;
      const k = KIND[p.kind] || [p.kind, 'tag-c0'];
      const self = p.byId === p.userId;
      return h('li', { class: 'log-row pw-row' },
        h('time', { class: 'log-time', text: fmtTime(p.at), title: new Date(p.at).toString() }),
        h('span', { class: 'log-chip task-tag ' + k[1], text: k[0] }),
        h('span', { class: 'log-text' }, h('strong', { text: t ? C.dn(t) : 'Unknown account' }), t ? ' (@' + t.username + ')' : '', self ? ' · by themselves' : [' · by ', h('strong', { text: by ? C.dn(by) : 'initial setup' })]));
    });
    return h('div', null, topbar({ active: 'pw' }),
      h('main', { class: 'page' }, pageHead('IT admin', 'Password log'),
        h('div', { class: 'settings-card' },
          h('p', { class: 'card-note', text: 'Who issued an invite or reset link, and when it was used. Nobody sets anyone else\'s password: people choose their own through a one-time link, and only a salted SHA-256 hash is stored. The demo accounts\' shared password is marked "demo password".' }),
          h('p', { class: 'log-note' }, 'This log is append-only. Nobody can edit or delete entries, IT admins included.'),
          h('ul', { class: 'log-list' }, rows))));
  }

  // ---------- profile editor ----------
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      if (!file || !/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return reject(new Error('Choose a JPG, PNG, WebP or GIF picture.'));
      if (file.size > 8 * 1024 * 1024) return reject(new Error('That picture is over 8 MB. Pick a smaller one.'));
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('Could not read that file.'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('That file isn\'t a readable picture.'));
        img.onload = () => {
          const S = 128; const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
          const ctx = cv.getContext('2d'); const m = Math.min(img.width, img.height);
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
          ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
          resolve(cv.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function pageProfile() {
    const u = C.me();
    let avatar = u.avatar; let presence = u.presence;
    const preview = h('div', { class: 'avatar-preview' });
    const paintAv = () => { clear(preview); preview.append(avatarEl({ name: u.name, avatar, presence }, 'avatar-xl')); };
    paintAv();
    const err = h('p', { class: 'form-error', role: 'alert' });
    const name = h('input', { type: 'text', id: 'p-name', maxlength: 40, value: u.name });
    const text = h('input', { type: 'text', id: 'p-text', maxlength: 80, value: u.statusText, placeholder: 'e.g. In a meeting until 14:00' });
    const file = h('input', { type: 'file', accept: 'image/*', id: 'p-file', class: 'sr-file', onchange: async () => {
      err.textContent = '';
      try { avatar = await resizeImage(file.files[0]); paintAv(); } catch (e) { err.textContent = e.message; }
      file.value = '';
    } });
    const seg = h('div', { class: 'status-seg presence-seg' }, C.PRESENCE.map((p) => h('button', { type: 'button', 'data-p': p, class: p === presence ? 'active' : '', onclick: () => { presence = p; seg.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.p === p)); } },
      h('span', { class: 'presence-dot p-' + p }), C.PRESENCE_LABEL[p])));
    const form = h('form', { class: 'settings-card', onsubmit: (e) => {
      e.preventDefault(); err.textContent = '';
      try { const changed = C.updateProfile({ name: name.value, avatar, presence, statusText: text.value }); toast(changed ? 'Profile saved.' : 'Nothing changed.'); render(); }
      catch (ex) { err.textContent = ex.message; }
    } },
      h('h2', { class: 'card-title', text: 'Your profile' }),
      h('div', { class: 'profile-pic-row' }, preview, h('div', null,
        h('label', { class: 'btn-ghost btn-small', for: 'p-file', tabindex: '0', onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, 'Upload picture'),
        ' ', h('button', { class: 'btn-ghost btn-small', type: 'button', onclick: () => { avatar = ''; paintAv(); }, text: 'Remove' }),
        h('p', { class: 'card-note', text: 'Shrunk to a small square and kept in this browser.' })), file),
      h('div', { class: 'form-group' }, h('label', { for: 'p-name' }, 'Display name'), name),
      h('div', { class: 'form-group' }, h('label', null, 'Status'), seg),
      h('div', { class: 'form-group' }, h('label', { for: 'p-text' }, 'Status message'), text),
      err, h('button', { class: 'btn', type: 'submit', text: 'Save profile' }));
    return h('div', null, topbar({ back: '#/', title: 'Your profile', meta: C.ROLE_LABEL[u.role] + ' · @' + u.username }),
      h('main', { class: 'page narrow' }, form, h('p', { class: 'card-note' }, 'Want to see what your account has done? ', h('a', { href: '#/user/' + u.id }, 'Open your account log'), '.')));
  }

  // ---------- logs ----------
  function pageRoadmapLog(rid) {
    const u = C.me(); const r = C.roadmapById(rid);
    if (!r || !C.canSeeRoadmapLog(u, r)) return pageMissing('That log doesn\'t exist, or you can\'t view it.');
    return h('div', null, topbar({ back: u.role === 'it' ? '#/' : '#/roadmap/' + r.id, title: 'Logs: ' + r.title, meta: 'Everything that happened on this roadmap, newest first' }),
      h('main', { class: 'page' }, h('div', { class: 'settings-card' }, logList(C.roadmapLog(rid), { empty: 'Nothing has happened on this roadmap yet.' }))));
  }
  function pageGlobalLog() {
    if (C.me().role !== 'it') return pageMissing('Only IT admins can see the full activity log.');
    return h('div', null, topbar({ active: 'log' }),
      h('main', { class: 'page' }, pageHead('IT admin', 'All activity'), h('div', { class: 'settings-card' }, logList(C.globalLog()))));
  }
  function pageMissing(text) {
    return h('div', null, topbar({}), h('main', { class: 'page' }, emptyState('Nothing to see here', text, h('div', { style: 'display:flex;gap:8px;justify-content:center;flex-wrap:wrap' }, h('a', { class: 'btn', href: '#/' }, 'Back to start'),
      h('button', { class: 'btn-ghost btn-small', type: 'button', onclick: async () => { await C.resetDemo(); toast('Demo data restored.'); go('#/'); render(); }, text: 'Reset demo data' })))));
  }

  // ============================================================
  // ROUTER
  // ============================================================
  function render() {
    closeCtx();
    if (modals.length === 0) document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open'));
    const u = C.me();
    const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean);
    let page;
    try {
      if (parts[0] === 'invite') page = pageInvite(parts.slice(1).join('/'));
      else if (!u) { page = pageLogin(); if (parts[0] && parts[0] !== 'login') history.replaceState(null, '', '#/login'); }
      else if (parts[0] === 'login' || !parts.length) { page = pageHome(); }
      else if (parts[0] === 'roadmap') page = pageRoadmap(parts[1]);
      else if (parts[0] === 'team') page = pageTeam();
      else if (parts[0] === 'user') page = pageUser(parts[1]);
      else if (parts[0] === 'profile') page = pageProfile();
      else if (parts[0] === 'log' && parts[1] === 'roadmap') page = pageRoadmapLog(parts[2]);
      else if (parts[0] === 'log') page = pageGlobalLog();
      else if (parts[0] === 'passwords') page = pagePasswords();
      else page = pageMissing('That page doesn\'t exist.');
    } catch (e) {
      page = pageMissing(e && e.message ? e.message : 'Something went wrong.');
    }
    const scroll = window.scrollY;
    const focusId = document.activeElement && document.activeElement.id;
    clear(app); app.append(page);
    if (u) document.title = 'Kivo Office';
    if (focusId) { const f = document.getElementById(focusId); if (f && modals.length === 0) f.focus(); }
    window.scrollTo(0, scroll);
  }
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
  // another tab changed the data: pick it up (modals are untouched, they live outside #app)
  window.addEventListener('storage', (e) => { if (e.key === 'kivo-office-v1' || e.key === 'kivo-office-session-v1') { Core.init().then(render); } });

  Core.init().then(() => {
    if (!C.me() && location.hash !== '#/login' && !/^#\/invite\//.test(location.hash)) history.replaceState(null, '', '#/login');
    render();
  }).catch((e) => { app.textContent = 'Could not start Kivo Office: ' + e.message; });
})();
